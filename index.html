<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finanzas Gasti</title>
<script src="https://cdn.tailwindcss.com"></script>

<!-- Ícono PNG generado por canvas (funciona en Safari iOS) -->
<script>
(function(){
  var c = document.createElement('canvas');
  c.width = c.height = 512;
  var x = c.getContext('2d');
  // Fondo verde fluor redondeado
  x.fillStyle = '#00ff88';
  x.beginPath();
  x.roundRect(0, 0, 512, 512, 90);
  x.fill();
  // Símbolo $ negro bold
  x.fillStyle = '#000';
  x.font = 'bold 340px Arial';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText('$', 256, 275);
  var url = c.toDataURL('image/png');
  // Apple Touch Icon — debe ir ANTES que cualquier otro link de ícono
  var l = document.createElement('link');
  l.rel = 'apple-touch-icon'; l.href = url;
  document.head.prepend(l);
  // Favicon
  var f = document.createElement('link');
  f.rel = 'icon'; f.type = 'image/png'; f.href = url;
  document.head.appendChild(f);
  // Manifest PWA dinámico
  var manifest = {
    name: 'Finanzas Gasti', short_name: 'Finanzas Gasti',
    start_url: '.', display: 'standalone',
    background_color: '#0f172a', theme_color: '#00ff88',
    icons: [{ src: url, sizes: '512x512', type: 'image/png' }]
  };
  var ml = document.createElement('link');
  ml.rel = 'manifest';
  ml.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
  document.head.appendChild(ml);
})();
</script>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas Gasti">
<meta name="theme-color" content="#00ff88">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  select option { background: #1e293b; }
</style>
</head>

<body class="bg-[#0f172a] text-slate-200">
<div class="max-w-md mx-auto p-5 pb-28">

  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-extrabold tracking-tight text-white">Balance <span style="color:#00ff88">Gasti</span></h1>
    <button onclick="borrarTodo()" class="bg-rose-900/30 p-3 rounded-xl text-rose-400 border border-rose-500/30 text-lg">🗑️</button>
  </div>

  <!-- Card saldo -->
  <div class="bg-slate-800 rounded-[2rem] p-7 text-white shadow-2xl mb-6 border border-slate-700">
    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-1">Disponible Real</p>
    <h2 id="balance" class="text-4xl font-bold mb-1" style="color:#00ff88">$ 0</h2>
    <div class="flex gap-6 mb-5 mt-2">
      <div>
        <p class="text-slate-500 text-xs uppercase tracking-wider">Ingresos mes</p>
        <p id="total-ingresos" class="text-emerald-400 font-bold text-lg">$ 0</p>
      </div>
      <div>
        <p class="text-slate-500 text-xs uppercase tracking-wider">Gastos mes</p>
        <p id="total-gastos" class="text-rose-400 font-bold text-lg">$ 0</p>
      </div>
    </div>
    <div class="flex justify-between text-[10px] mb-2">
      <span class="text-slate-400 uppercase font-bold tracking-tighter">Gasto / Ingreso del mes</span>
      <span id="porcentaje" class="font-bold text-xs" style="color:#00ff88">0%</span>
    </div>
    <div class="w-full bg-slate-900 h-3 rounded-full border border-slate-700">
      <div id="barra" class="h-3 rounded-full transition-all duration-500" style="width:0%;background:#00ff88"></div>
    </div>
  </div>

  <!-- Filtro mes -->
  <select id="filtro-mes" onchange="actualizar()"
    class="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl text-white outline-none mb-5 font-bold">
  </select>

  <!-- Formulario -->
  <div class="bg-slate-800 rounded-3xl p-5 border border-slate-700 mb-6 shadow-xl">
    <div class="grid gap-3">
      <input id="desc" type="text" placeholder="¿Qué es? (ej: Alquiler Mayo)"
        class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none text-white focus:border-[#00ff88] transition-colors">
      <div class="flex gap-2">
        <input id="monto" type="number" placeholder="Monto $"
          class="flex-1 p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none text-white focus:border-[#00ff88] transition-colors">
        <select id="cat" class="bg-slate-700 px-4 rounded-2xl text-2xl border border-slate-600 outline-none">
          <option value="comida">🍔</option>
          <option value="alquiler">🏠</option>
          <option value="expensas">🏢</option>
          <option value="telefono">📱</option>
          <option value="cuotas">💳</option>
          <option value="sueldo">💰</option>
          <option value="transporte">🚌</option>
          <option value="salud">❤️‍🩹</option>
          <option value="otros">📦</option>
        </select>
      </div>
      <div class="flex gap-3">
        <button onclick="agregar('ingreso')"
          class="flex-1 font-bold py-4 rounded-2xl active:scale-95 transition-all text-lg text-black"
          style="background:#00ff88">+ Ingreso</button>
        <button onclick="agregar('gasto')"
          class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-4 rounded-2xl active:scale-95 transition-all text-lg">
          − Gasto</button>
      </div>
    </div>
  </div>

  <!-- Botón exportar Excel -->
  <button onclick="exportarExcel()"
    class="w-full mb-6 py-4 rounded-2xl font-bold text-black text-lg active:scale-95 transition-all border-2 flex items-center justify-center gap-2"
    style="background:#00ff88;border-color:#00cc66">
    📊 Exportar a Excel (.csv)
  </button>

  <!-- Lista -->
  <h3 class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-4 px-1">Movimientos del mes</h3>
  <ul id="lista" class="space-y-3"></ul>

</div>

<script>
const iconMap = { comida:'🍔', alquiler:'🏠', expensas:'🏢', telefono:'📱', cuotas:'💳', sueldo:'💰', transporte:'🚌', salud:'❤️‍🩹', otros:'📦' };
const KEY = 'finanzas_gasti_v3';
let movimientos = JSON.parse(localStorage.getItem(KEY)) || [];

function guardar() {
  localStorage.setItem(KEY, JSON.stringify(movimientos));
}

function mesKey(fecha) {
  var f = new Date(fecha);
  return f.getFullYear() + '-' + String(f.getMonth()).padStart(2,'0');
}

function mesLabel(key) {
  var parts = key.split('-');
  var f = new Date(parseInt(parts[0]), parseInt(parts[1]));
  return f.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }).toUpperCase();
}

function initFiltro() {
  var sel = document.getElementById('filtro-mes');
  var actual = mesKey(new Date());
  var meses = [...new Set(movimientos.map(m => mesKey(m.fecha)))];
  if (!meses.includes(actual)) meses.push(actual);
  meses.sort((a,b) => b.localeCompare(a)); // más reciente primero
  var prev = sel.value || actual;
  sel.innerHTML = meses.map(m =>
    '<option value="' + m + '"' + (m === prev ? ' selected' : '') + '>' + mesLabel(m) + '</option>'
  ).join('');
}

function actualizar() {
  var sel = document.getElementById('filtro-mes');
  var filtro = sel.value || mesKey(new Date());
  var lista = document.getElementById('lista');
  var balanceElt = document.getElementById('balance');
  var barra = document.getElementById('barra');
  var porcElt = document.getElementById('porcentaje');

  lista.innerHTML = '';
  var balanceTotal = 0;
  var ingresosMes = 0;
  var gastosMes = 0;
  var itemsMes = [];

  movimientos.forEach(function(m) {
    var esIngreso = m.tipo === 'ingreso';
    var monto = parseFloat(m.monto);
    balanceTotal += esIngreso ? monto : -monto;
    if (mesKey(m.fecha) === filtro) {
      if (esIngreso) ingresosMes += monto;
      else gastosMes += monto;
      itemsMes.push(m);
    }
  });

  // Mostrar items del mes (más recientes primero)
  itemsMes.slice().reverse().forEach(function(m) {
    var esIngreso = m.tipo === 'ingreso';
    var monto = parseFloat(m.monto);
    var li = document.createElement('li');
    li.className = 'flex justify-between items-center p-4 bg-slate-800 rounded-2xl border border-slate-700';
    li.innerHTML =
      '<div class="flex items-center gap-3">' +
        '<div class="bg-slate-900 w-10 h-10 flex items-center justify-center rounded-xl text-xl border border-slate-700">' +
          (iconMap[m.cat] || '📦') +
        '</div>' +
        '<div>' +
          '<p class="text-sm font-bold text-slate-200">' + m.desc + '</p>' +
          '<p class="text-xs text-slate-500">' + new Date(m.fecha).toLocaleDateString('es-AR') + '</p>' +
        '</div>' +
      '</div>' +
      '<span class="font-black text-lg ' + (esIngreso ? 'text-emerald-400' : 'text-rose-400') + '">' +
        (esIngreso ? '+' : '-') + '$ ' + monto.toLocaleString('es-AR') +
      '</span>';
    lista.appendChild(li);
  });

  if (itemsMes.length === 0) {
    lista.innerHTML = '<li class="text-center text-slate-600 py-8 text-sm">Sin movimientos este mes</li>';
  }

  // Balance
  balanceElt.innerText = '$ ' + balanceTotal.toLocaleString('es-AR');
  balanceElt.style.color = balanceTotal >= 0 ? '#00ff88' : '#f87171';

  // Totales mes
  document.getElementById('total-ingresos').innerText = '$ ' + ingresosMes.toLocaleString('es-AR');
  document.getElementById('total-gastos').innerText = '$ ' + gastosMes.toLocaleString('es-AR');

  // Barra
  var porc = ingresosMes > 0 ? (gastosMes / ingresosMes) * 100 : (gastosMes > 0 ? 100 : 0);
  porc = Math.min(porc, 100);
  barra.style.width = porc + '%';
  porcElt.innerText = Math.round(porc) + '% del Ingreso';
  if (porc > 90) { barra.style.background = '#f87171'; porcElt.style.color = '#f87171'; }
  else if (porc > 70) { barra.style.background = '#fb923c'; porcElt.style.color = '#fb923c'; }
  else { barra.style.background = '#00ff88'; porcElt.style.color = '#00ff88'; }

  guardar();
}

function agregar(tipo) {
  var desc = document.getElementById('desc').value.trim();
  var monto = parseFloat(document.getElementById('monto').value);
  var cat = document.getElementById('cat').value;
  if (!desc || !monto || monto <= 0) {
    alert('Completá la descripción y el monto 👆');
    return;
  }
  movimientos.push({ desc: desc, monto: monto, tipo: tipo, cat: cat, fecha: new Date().toISOString() });
  document.getElementById('desc').value = '';
  document.getElementById('monto').value = '';
  initFiltro();
  actualizar();
}

function borrarTodo() {
  if (confirm('¿Reiniciar todo el historial? Esta acción no se puede deshacer.')) {
    movimientos = [];
    localStorage.removeItem(KEY);
    initFiltro();
    actualizar();
  }
}

function exportarExcel() {
  if (movimientos.length === 0) { alert('No hay movimientos para exportar.'); return; }
  var filas = [['Fecha','Tipo','Categoría','Descripción','Monto']];
  movimientos.slice().sort((a,b) => new Date(a.fecha)-new Date(b.fecha)).forEach(function(m) {
    filas.push([
      new Date(m.fecha).toLocaleDateString('es-AR'),
      m.tipo === 'ingreso' ? 'Ingreso' : 'Gasto',
      iconMap[m.cat] + ' ' + m.cat,
      m.desc,
      m.monto
    ]);
  });
  // BOM para que Excel reconozca tildes y ñ
  var csv = '\uFEFF' + filas.map(function(r) {
    return r.map(function(c) { return '"' + String(c).replace(/"/g,'""') + '"'; }).join(',');
  }).join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'finanzas_gasti_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

// Init
initFiltro();
actualizar();
</script>
</body>
</html>
