<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finanzas PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-md mx-auto p-4">
        <div class="bg-white rounded-3xl shadow-xl p-6 mt-4">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Mi Billetera</h1>
                    <p class="text-gray-500">Control de Gastos</p>
                </div>
                <button onclick="borrarTodo()" class="text-xs text-red-400 font-bold uppercase">Limpiar</button>
            </div>

            <div class="bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl p-6 text-white mb-6 shadow-lg">
                <p class="text-gray-400 text-xs uppercase font-bold tracking-widest">Balance Disponible</p>
                <p id="balance" class="text-4xl font-bold mt-1">$ 0</p>
            </div>

            <div class="space-y-3 bg-gray-50 p-4 rounded-2xl mb-6">
                <input id="desc" type="text" placeholder="¿Qué es? (Ej: Sueldo, Pizza...)" class="w-full p-3 bg-white border-none rounded-xl shadow-sm outline-none">
                <input id="monto" type="number" placeholder="Monto $" class="w-full p-3 bg-white border-none rounded-xl shadow-sm outline-none">
                <div class="flex gap-2">
                    <button onclick="agregar('ingreso')" class="flex-1 bg-green-500 text-white font-bold py-3 rounded-xl active:scale-95 transition-all">💰 Ingreso</button>
                    <button onclick="agregar('gasto')" class="flex-1 bg-red-500 text-white font-bold py-3 rounded-xl active:scale-95 transition-all">💸 Gasto</button>
                </div>
            </div>

            <h3 class="text-gray-400 text-xs font-bold uppercase mb-4 tracking-widest">Movimientos</h3>
            <ul id="lista" class="space-y-3"></ul>
        </div>
    </div>

    <script>
        let movimientos = JSON.parse(localStorage.getItem('movimientos_gaston')) || [];
        
        function actualizar() {
            const lista = document.getElementById('lista');
            const balanceElt = document.getElementById('balance');
            lista.innerHTML = '';
            let balance = 0;
            
            movimientos.slice().reverse().forEach((m, i) => {
                const esIngreso = m.tipo === 'ingreso';
                balance += esIngreso ? parseFloat(m.monto) : -parseFloat(m.monto);
                
                lista.innerHTML += `
                    <li class="flex justify-between items-center p-4 bg-white rounded-xl border border-gray-100 shadow-sm">
                        <span class="text-gray-700 font-medium">${m.desc}</span>
                        <span class="${esIngreso ? 'text-green-500' : 'text-red-500'} font-bold">
                            ${esIngreso ? '+' : '-'}$${parseFloat(m.monto).toLocaleString()}
                        </span>
                    </li>`;
            });
            balanceElt.innerText = `$ ${balance.toLocaleString()}`;
            localStorage.setItem('movimientos_gaston', JSON.stringify(movimientos));
        }

        function agregar(tipo) {
            const desc = document.getElementById('desc').value;
            const monto = document.getElementById('monto').value;
            if(desc && monto) {
                movimientos.push({desc, monto, tipo});
                document.getElementById('desc').value = '';
                document.getElementById('monto').value = '';
                actualizar();
            }
        }

        function borrarTodo() {
            if(confirm('¿Borrar todos los datos?')) {
                movimientos = [];
                actualizar();
            }
        }
        actualizar();
    </script>
</body>
</html>
