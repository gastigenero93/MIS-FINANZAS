<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finanzas Gasti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2310b981'/%3E%3Ctext y='.9em' x='50%25' text-anchor='middle' font-size='80' fill='white'%3E$%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2310b981'/%3E%3Ctext y='.9em' x='50%25' text-anchor='middle' font-size='80' fill='white'%3E$%3C/text%3E%3C/svg%3E">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GastiFin">
</head>
<body class="bg-[#0f172a] text-slate-200 font-sans">
    <div class="max-w-md mx-auto p-5 pb-24">
        
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-tight text-white">Balance</h1>
            <button onclick="borrarTodo()" class="bg-rose-900/30 p-2 rounded-xl text-rose-400 border border-rose-500/30">🗑️</button>
        </div>

        <div class="bg-slate-800 rounded-[2rem] p-7 text-white shadow-2xl mb-8 border border-slate-700 relative overflow-hidden">
            <div class="relative z-10">
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-1">Disponible Real</p>
                <h2 id="balance" class="text-4xl font-bold mb-6 text-yellow-400">$ 0</h2>
                
                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between text-[10px] mb-2">
                            <span id="label-info" class="text-slate-400 uppercase font-bold tracking-tighter">Gasto / Ingresos Mes</span>
                            <span id="porcentaje" class="font-bold text-blue-400 text-xs">0%</span>
                        </div>
                        <div class="w-full bg-slate-900 h-3 rounded-full border border-slate-700">
                            <div id="barra-progreso" class="bg-blue-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-6">
            <select id="filtro-mes" onchange="actualizar()" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl text-white outline-none">
                </select>
        </div>

        <div class="bg-slate-800 rounded-3xl p-6 border border-slate-700 mb-8 shadow-xl">
            <div class="grid grid-cols-1 gap-4">
                <input id="desc" type="text" placeholder="¿Qué es?" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none text-white focus:border-emerald-500">
                <div class="flex gap-2">
                    <input id="monto" type="number" placeholder="Monto $" class="flex-1 p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none text-white focus:border-emerald-500">
                    <select id="cat" class="bg-slate-700 px-4 rounded-2xl text-2xl border border-slate-600">
                        <option value="comida">🍔</option>
                        <option value="alquiler">🏠</option>
                        <option value="expensas">🏢</option>
                        <option value="telefono">📱</option>
                        <option value="sueldo">💰</option>
                        <option value="otros">📦</option>
                    </select>
                </div>
                <div class="flex gap-3">
                    <button onclick="agregar('ingreso')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl active:scale-95 transition-all shadow-lg shadow-emerald-900/20 text-lg">Ingreso</button>
                    <button onclick="agregar('gasto')" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-4 rounded-2xl active:scale-95 transition-all shadow-lg shadow-rose-900/20 text-lg">Gasto</button>
                </div>
            </div>
        </div>

        <h3 class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-4 px-2">Movimientos del mes</h3>
        <ul id="lista" class="space-y-3"></ul>
    </div>

    <script>
        const iconMap = { comida: '🍔', alquiler: '🏠', expensas: '🏢', telefono: '📱', sueldo: '💰', otros: '📦' };
        // Usamos una clave diferente para asegurar que los datos antiguos no corrompan la lógica nueva
        let movimientos = JSON.parse(localStorage.getItem('finanzas_gasti_v2026_final')) || [];

        function initFiltro() {
            const select = document.getElementById('filtro-mes');
            // Aseguramos que siempre haya al menos el mes actual si no hay datos
            const mesesCargados = [...new Set(movimientos.map(m => {
                const f = new Date(m.fecha);
                return `${f.getMonth()}-${f.getFullYear()}`;
            }))];
            
            const hoy = new Date();
            const mesActualLabel = `${hoy.getMonth()}-${hoy.getFullYear()}`;
            if (!mesesCargados.includes(mesActualLabel)) mesesCargados.push(mesActualLabel);

            // Ordenamos los meses (más recientes primero)
            mesesCargados.sort((a, b) => {
                const [mA, aA] = a.split('-');
                const [mB, aB] = b.split('-');
                return new Date(aB, mB) - new Date(aA, mA);
            });

            select.innerHTML = mesesCargados.map(m => {
                const [mes, anio] = m.split('-');
                const fechaLabel = new Date(anio, mes).toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
                return `<option value="${m}" ${m === mesActualLabel ? 'selected' : ''}>${fechaLabel.toUpperCase()}</option>`;
            }).join('');
        }

        function actualizar() {
            const lista = document.getElementById('lista');
            const balanceElt = document.getElementById('balance');
            const barra = document.getElementById('barra-progreso');
            const porcElt = document.getElementById('porcentaje');
            const filtroElt = document.getElementById('filtro-mes');
            
            // Si no hay datos, el filtro puede no existir todavía
            if (!filtroElt || !filtroElt.value) {
                initFiltro();
            }
            const filtro = filtroElt.value;
            const [fMes, fAnio] = filtro.split('-');

            lista.innerHTML = '';
            let balanceTotal = 0;
            let ingresosMes = 0;
            let gastosMes = 0;

            movimientos.forEach(m => {
                const f = new Date(m.fecha);
                const esIngreso = m.tipo === 'ingreso';
                const monto = parseFloat(m.monto);
                
                // Balance Global (siempre suma/resta todo)
                balanceTotal += esIngreso ? monto : -monto;

                // Solo calculamos y mostramos si es el mes filtrado
                if (f.getMonth() == fMes && f.getFullYear() == fAnio) {
                    if (esIngreso) ingresosMes += monto;
                    else gastosMes += monto;

                    lista.innerHTML = `
                        <li class="flex justify-between items-center p-4 bg-slate-800 rounded-2xl border border-slate-700 mb-2">
                            <div class="flex items-center gap-4">
                                <div class="bg-slate-900 w-10 h-10 flex items-center justify-center rounded-xl text-xl border border-slate-700">${iconMap[m.cat] || '📦'}</div>
                                <div><p class="text-sm font-bold text-slate-200">${m.desc}</p></div>
                            </div>
                            <span class="${esIngreso ? 'text-emerald-400' : 'text-rose-400'} font-black text-lg">$${monto.toLocaleString()}</span>
                        </li>` + lista.innerHTML; // Agrega arriba
                }
            });

            balanceElt.innerText = `$ ${balanceTotal.toLocaleString()}`;
            
            // Barra de progreso dinámica: Porcentaje de gastos sobre ingresos del mes
            let porc = ingresosMes > 0 ? (gastosMes / ingresosMes) * 100 : 0;
            if (porc > 100) porc = 100; // Cap al 100%
            
            // Si no hay ingresos, la barra no se mueve, pero si hay gastos y 0 ingresos, mostramos 100% de consumo (rojo)
            if (ingresosMes === 0 && gastosMes > 0) porc = 100;

            barra.style.width = porc + '%';
            porcElt.innerText = Math.round(porc) + '% del Ingreso';
            
            // Cambiar color de la barra según el consumo
            if (porc > 90) barra.className = "bg-rose-500 h-3 rounded-full transition-all duration-500 shadow-[0_0_10px_rgba(244,63,94,0.3)]";
            else if (porc > 70) barra.className = "bg-orange-400 h-3 rounded-full transition-all duration-500";
            else barra.className = "bg-blue-500 h-3 rounded-full transition-all duration-500";

            localStorage.setItem('finanzas_gasti_v2026_final', JSON.stringify(movimientos));
        }

        function agregar(tipo) {
            const desc = document.getElementById('desc').value;
            const monto = document.getElementById('monto').value;
            const cat = document.getElementById('cat').value;
            if(desc && monto) {
                // Forzamos que la fecha sea AHORA para el nuevo movimiento
                movimientos.push({ desc, monto: parseFloat(monto), tipo, cat, fecha: new Date().toISOString() });
                document.getElementById('desc').value = '';
                document.getElementById('monto').value = '';
                // Regeneramos el filtro por si es un mes nuevo
                initFiltro();
                actualizar();
            }
        }

        function borrarTodo() {
            if(confirm('¿Reiniciar todo el historial?')) {
                movimientos = [];
                localStorage.clear();
                // Forzamos recarga para resetear todo el estado
                location.reload();
            }
        }

        // Arrancamos
        initFiltro();
        actualizar();
    </script>
</body>
</html>
