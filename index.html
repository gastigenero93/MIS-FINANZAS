<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mis Finanzas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1077/1077046.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-md mx-auto p-4">
        <div class="bg-white rounded-3xl shadow-xl p-6 mt-4">
            <h1 class="text-2xl font-bold text-gray-800">Mis Finanzas</h1>
            <p class="text-gray-500 mb-6">Hola, Gastón 👋</p>

            <div class="bg-blue-600 rounded-2xl p-6 text-white mb-6 shadow-lg shadow-blue-200">
                <p class="text-blue-100 text-sm uppercase tracking-wider font-semibold">Total Gastado</p>
                <p id="total" class="text-4xl font-bold mt-1">$ 0</p>
            </div>

            <div class="space-y-3">
                <input id="desc" type="text" placeholder="¿En qué gastaste?" class="w-full p-4 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                <input id="monto" type="number" placeholder="Monto $" class="w-full p-4 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="agregar()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all active:scale-95 shadow-md">
                    ➕ Agregar Gasto
                </button>
            </div>

            <div class="mt-8">
                <h3 class="text-gray-400 text-xs font-bold uppercase mb-4">Últimos movimientos</h3>
                <ul id="lista" class="space-y-3">
                    </ul>
            </div>
        </div>
    </div>

    <script>
        let gastos = JSON.parse(localStorage.getItem('gastos_gaston')) || [];
        
        function actualizar() {
            const lista = document.getElementById('lista');
            const totalElt = document.getElementById('total');
            lista.innerHTML = '';
            let total = 0;
            
            gastos.reverse().forEach((g, i) => {
                total += parseFloat(g.monto);
                lista.innerHTML += `
                    <li class="flex justify-between items-center p-4 bg-gray-50 rounded-xl animate-fade-in">
                        <span class="text-gray-700 font-medium">${g.desc}</span>
                        <span class="text-red-500 font-bold">-$${parseFloat(g.monto).toLocaleString()}</span>
                    </li>`;
            });
            gastos.reverse(); // Volver al orden original
            totalElt.innerText = `$ ${total.toLocaleString()}`;
            localStorage.setItem('gastos_gaston', JSON.stringify(gastos));
        }

        function agregar() {
            const desc = document.getElementById('desc').value;
            const monto = document.getElementById('monto').value;
            if(desc && monto) {
                gastos.push({desc, monto});
                document.getElementById('desc').value = '';
                document.getElementById('monto').value = '';
                actualizar();
            }
        }
        actualizar();
    </script>
</body>
</html>
